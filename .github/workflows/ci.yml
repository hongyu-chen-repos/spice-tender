name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate data
        run: node tools/validate.mjs
      - name: Run engine tests
        run: node --test tools/test.mjs
      - name: Check the writing
        run: node tools/voice.mjs
